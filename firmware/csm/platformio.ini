# Successor bus0 ingest. The RP2040 feeder owns MCP25625/SPI/ACK and publishes
# observation-only CAN batches to M7 USART6 RX (Mid Carrier J14 RX2) at 1 Mbaud.
# The legacy on-M7 MCP path remains compiled out and cannot transmit. This
# exact product profile separately enables qualified RC vehicle commands on J4.
[env:portenta_h7_m7_mid_feeder_uart_j4_remote_product_wifi]
extends = env:portenta_h7_m7_mid_mcp2515_j4_remote_product_wifi
board_build.ldscript = linker/portenta_h7_m7_product.ld
build_src_filter =
  ${env:portenta_h7_m7_mid_mcp2515_j4_remote_product_wifi.build_src_filter}
  +<board/feeder/FeederUartIngress.cpp>
build_flags =
  -D BOARD_USE_PINNED_PRODUCT_MBED=1
