; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = portenta_h7_m7_mid_mcp2515_j4_dual_csm_passive

[env]
extra_scripts =
  pre:tools/build_identity.py
  pre:tools/runtime_contract_identity_guard.py
  pre:tools/passive_guard.py
  pre:tools/source_manifest_guard.py
  pre:tools/reset_experiment_profile_guard.py
  pre:tools/remote_mdps_bench_guard.py
  pre:tools/product_mbed_overlay.py

[env:portenta_h7_m7]
platform = ststm32@19.2.0
platform_packages =
  framework-arduino-mbed@4.3.1
board = portenta_h7_m7
board_build.ldscript = linker/portenta_h7_m7_standard.ld
framework = arduino
build_src_filter =
  +<*>
  -<diag/*>
  -<usb_min.cpp>
  -<can_spi_diag.cpp>
  -<mcp_int_diag.cpp>
  -<int_pin_usb_diag.cpp>
  -<spi_loopback_diag.cpp>
  -<cs_drive_diag.cpp>
  -<pin_step_diag.cpp>
  -<mcp_bb_diag.cpp>
  -<mcp_pin_truth_diag.cpp>
  -<mcp_slow_active_diag.cpp>
  -<mcp_spi_variants_diag.cpp>
  -<mcp_loopback_diag.cpp>
  -<m4_remote_frontend_build_proof.cpp>
  -<m4_remote_serial3_capture_probe.cpp>
  -<m4_remote_frontend.cpp>
  -<board/remote/RemoteSharedMemory.cpp>
  -<board/feeder/FeederUartIngress.cpp>
  -<board/uplink/WifiTcpSink.cpp>
  -<board/uplink/WifiSocketWorker.cpp>
lib_deps =
  https://github.com/autowp/arduino-mcp2515.git#737f0d536770dc7182bc18e0168f38a810f710a8

[env:portenta_h7_m7_wifi_raw_blocking_ap]
platform = ststm32@19.2.0
platform_packages =
  framework-arduino-mbed@4.3.1
board = portenta_h7_m7
board_build.ldscript = linker/portenta_h7_m7_standard.ld
framework = arduino
lib_ignore =
  RPC
  openamp_arduino
build_src_filter =
  -<*>
  +<diag/wifi_raw_tx_bench.cpp>
build_flags =
  -D BOARD_WIFI_RAW_BENCH=1
  -D BOARD_WIFI_RAW_BLOCKING=1
  -D BOARD_WIFI_RAW_AP_SSID=\"VSM-CSM-DEV\"
  -D BOARD_WIFI_RAW_AP_PASSPHRASE=\"vsm-csm-dev\"
  -D BOARD_WIFI_RAW_AP_CHANNEL=1
  -D BOARD_WIFI_RAW_TCP_PORT=3333
monitor_speed = 115200

[env:portenta_h7_m7_wifi_raw_sigio_ap]
extends = env:portenta_h7_m7_wifi_raw_blocking_ap
build_flags =
  -D BOARD_WIFI_RAW_BENCH=1
  -D BOARD_WIFI_RAW_BLOCKING=0
  -D BOARD_WIFI_RAW_AP_SSID=\"VSM-CSM-DEV\"
