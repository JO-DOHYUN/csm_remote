; CSM Service/HIL paired M7/M4 product builds only.
; Both environments are intentionally self-contained: no legacy/diagnostic
; build environments.

[platformio]
default_envs =
  portenta_h7_m7_mid_feeder_uart_j4_remote_service_hil_wifi
  portenta_h7_m4_remote_frontend

[env]
extra_scripts =
  pre:tools/build_identity.py
  pre:tools/runtime_contract_identity_guard.py
  pre:tools/source_manifest_guard.py
  pre:tools/product_mbed_overlay.py

[env:portenta_h7_m7_mid_feeder_uart_j4_remote_service_hil_wifi]
platform = ststm32@19.2.0
platform_packages =
  framework-arduino-mbed@4.3.1
board = portenta_h7_m7
board_build.ldscript = linker/portenta_h7_m7_product.ld
framework = arduino
upload_port = COM12
lib_ignore =
  RPC
  openamp_arduino
lib_deps =
  https://github.com/autowp/arduino-mcp2515.git#737f0d536770dc7182bc18e0168f38a810f710a8
build_src_filter =
  +<*>
  -<diag/*>
  -<usb_min.cpp>
  -<can_spi_diag.cpp>
  -<mcp_int_diag.cpp>
  -<int_pin_usb_diag.cpp>
  -<spi_loopback_diag.cpp>
  -<cs_drive_diag.cpp>
  -<pin_step_diag.cpp>
  -<mcp_bb_diag.cpp>
  -<mcp_pin_truth_diag.cpp>
  -<mcp_slow_active_diag.cpp>
  -<mcp_spi_variants_diag.cpp>
  -<mcp_loopback_diag.cpp>
  -<m4_remote_frontend_build_proof.cpp>
  -<m4_remote_serial3_capture_probe.cpp>
  -<m4_remote_frontend.cpp>
  -<board/uplink/WifiTcpSinkDisabled.cpp>
build_flags =
  -D BOARD_USE_PINNED_PRODUCT_MBED=1
  -D BOARD_CSM_PROFILE_REMOTE_PRODUCT=0
  -D BOARD_CSM_PROFILE_PASSIVE_PRODUCT=0
  -D BOARD_CSM_PROFILE_FULL_INSTRUMENTED=1
  -D BOARD_ENABLE_REMOTE_CONTROL=1
  -D BOARD_ENABLE_REMOTE_AUTHORITY=1
  -D BOARD_ENABLE_PRODUCT_VEHICLE_COMMAND_MAPPING=0
  -D BOARD_ENABLE_SERVICE_HIL_VEHICLE_COMMAND_MAPPING=1
  -D BOARD_ENABLE_MDPS_BENCH_MAPPING=0
  -D BOARD_REMOTE_DRIVE_CHANNEL_INDEX=3
  -D BOARD_REMOTE_STEERING_CHANNEL_INDEX=1
  -D BOARD_ENABLE_SERVICE_HIL_JOYSTICK_IDS=1
  -D BOARD_ALLOW_VIRTUAL_CONTROL_EVIDENCE_BENCH=1
  -D BOARD_ALLOW_LAB_SHARED_CREDENTIAL=1
  -D BOARD_HW_PROFILE_MID_FEEDER_UART=1
  -D BOARD_ENABLE_FEEDER_UART=1
  -D BOARD_FEEDER_UART_BAUD=1000000UL
  -D BOARD_FEEDER_UART_STALE_MS=250UL
  -D BOARD_FEEDER_UART_SERVICE_BYTE_BUDGET=4096UL
  -D BOARD_FEEDER_CAN_BUS_ID=0
  -D BOARD_FEEDER_CAN_BUS_ROLE=2
  -D BOARD_ENABLE_MCP2515=0
  -D BOARD_ENABLE_MCP2515_INIT=0
  -D BOARD_CAN_IRQ_MODE=0
  -D BOARD_ENABLE_BUILTIN_CAN_RX=1
  -D BOARD_ENABLE_BUILTIN_CAN_TX_TEST=0
  -D BOARD_ENABLE_HOST_CAN_TX=1
  -D BOARD_ENABLE_HOST_CAN_TX_BUILTIN=1
  -D BOARD_ENABLE_HOST_CAN_TX_MCP2515=0
  -D BOARD_ENABLE_HOST_DOWNLINK=1
  -D BOARD_HOST_DOWNLINK_TRANSPORT_WIFI=1
  -D BOARD_ENABLE_ENCODER_IO=0
  -D BOARD_MCP2515_BUS_ID=0
  -D BOARD_MCP2515_BUS_ROLE=0
  -D BOARD_MCP2515_CONTROL_TX_ALLOWED=0
  -D BOARD_MCP2515_LISTEN_ONLY_BY_DEFAULT=1
  -D BOARD_BUILTIN_CAN_BUS_ID=1
  -D BOARD_BUILTIN_CAN_BUS_ROLE=1
  -D BOARD_BUILTIN_CAN_CONTROL_TX_ALLOWED=1
  -D BOARD_CAN_SERIAL_DRAIN_BUDGET=128
  -D BOARD_CAN_RX_SEGMENT_FLUSH_US=20000
  -D BOARD_SERIAL_TX_CHUNK_BYTES=512
  -D BOARD_USB_SINK_QUEUE_RECORDS=208
  -D BOARD_USB_SINK_QUEUE_BYTES=40960
  -D BOARD_USB_TRANSIENT_COVERAGE_MS=0
  -D BOARD_ENABLE_MCP2515_TX_TEST=0
  -D BOARD_MCP2515_SPI_HZ=2000000
  -D BOARD_USB_CDC_RECONNECT_RESET_MS=0
  -D BOARD_ENABLE_WIFI_UPLINK=1
  -D BOARD_WIFI_AP_SSID=\"VSM-CSM-DEV\"
  -D BOARD_WIFI_AP_PASSPHRASE=\"vsm-csm-dev\"
  -D BOARD_WIFI_TCP_PORT=3333
  -D BOARD_WIFI_AP_CHANNEL=1
  -D BOARD_WIFI_AP_STA_CONCUR=1
  -D BOARD_WIFI_SINK_QUEUE_RECORDS=256
  -D BOARD_WIFI_SINK_QUEUE_BYTES=49152
  -D BOARD_WIFI_SINK_CRITICAL_RESERVE_BYTES=2112
  -D BOARD_WIFI_TRANSIENT_COVERAGE_MS=0
  -D BOARD_WIFI_PRESSURE_HIGH_WATER_BYTES=32768
  -D BOARD_WIFI_PRESSURE_LOW_WATER_BYTES=8192
  -D BOARD_WIFI_PRESSURE_HIGH_WATER_RECORDS=192
  -D BOARD_WIFI_PRESSURE_LOW_WATER_RECORDS=64
  -D BOARD_WIFI_STALL_TIMEOUT_MS=5000
  -D BOARD_WIFI_CALL_STALL_TIMEOUT_MS=5000
  -D BOARD_CAPABILITY_PERIOD_MS=10000
  -D BOARD_ENABLE_PERIODIC_CAPABILITY=0
  -D BOARD_ENABLE_WIFI_DEEP_DIAGNOSTICS=1

[env:portenta_h7_m4_remote_frontend]
platform = ststm32@19.2.0
platform_packages =
  framework-arduino-mbed@4.3.1
board = portenta_h7_m4
board_build.ldscript = linker/portenta_h7_m4_product.ld
framework = arduino
lib_ignore =
  RPC
  openamp_arduino
build_src_filter =
  -<*>
  +<m4_remote_frontend.cpp>
  +<board/remote/RemoteTypes.cpp>
  +<board/remote/CrsfParser.cpp>
  +<board/remote/RcNormalizer.cpp>
  +<board/remote/M4RemoteMailboxContract.cpp>
  +<board/remote/M4RemoteMailboxWriter.cpp>
  +<board/remote/RemoteSharedMemory.cpp>
build_flags =
  -D BOARD_ENABLE_REMOTE_CONTROL=1
  -D BOARD_ENABLE_M4_REMOTE_FRONTEND=1
  -D BOARD_ENABLE_REMOTE_AUTHORITY=0
  -D BOARD_ENABLE_HOST_CAN_TX=0
  -D BOARD_ENABLE_HOST_DOWNLINK=0
  -D BOARD_M4_REMOTE_BAUD=416666UL
  -D BOARD_M4_REMOTE_STALE_MS=100UL
  -D BOARD_M4_REMOTE_PUBLISH_MS=20UL
