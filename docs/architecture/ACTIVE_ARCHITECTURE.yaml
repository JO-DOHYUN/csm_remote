    electrical_mode: crsf_blue
    configured_baud: 416666
    product_radio_mode: fhss_v2_1_16_channel
    address: 0xC8
    required_control_channels: [CH4_drive, CH2_steering]
    optional_function_channels: [CH5_auxiliary, CH10_steering_overlay, CH11_momentary_overlay]
    consecutive_fresh_frames: 3
    link_statistics: optional_when_absent_zero_or_stale_veto_when_observed
  authority_handoff: quiescent_cancel_terminal_then_activate
  mutable_executor_state_writer: csm_m4_tim4_only
  foreground_ingress: latest_validated_snapshot_or_event_depth_1
  fdcan_irq_ingress: bounded_terminal_error_latch_only
  health_read_side_effects: forbidden
  source_epoch_owner: csm_m7_global_source_selection
  activation_epoch_owner: explicit_host_arm_or_fresh_rc_activation
  source_lane_ownership:
    host: [0x005, 0x007, 0x364]
    remote: [0x005, 0x007]
  static_slots:
    base_period_us: 5000
    slot_0: [0x005, 0x007, 0x364]
    slots_1_2_3: [0x005]
  dedicated_tx_buffers:
    0x005: 0
    0x007: 1
    0x364: 2
  strict_n_shot_owner: csm_m4_generic_success_budget
  state_split:
    physical_transport_readiness: m4_fdcan1_transport_only
    active_motion_permission: fresh_coherent_source_owned_lane_permit_explicit_arm
    inactive_wire_behavior: m4_frozen_per_lane_safe_wire_policy
